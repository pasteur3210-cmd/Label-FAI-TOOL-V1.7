name: Build Label Inspection Tool V1.7.2

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff
      - name: Static undefined-name check (Ruff F821)
        run: ruff check label_tool --select F821
      - name: Compile check
        run: python -m compileall -q label_tool tests
      - name: Unit tests + test log
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release_logs | Out-Null
          python -m unittest discover -s tests -v 2>&1 | Tee-Object -FilePath release_logs\test_log.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build EXE
        run: pyinstaller --noconfirm build.spec
      - name: Packaged EXE OCR runtime smoke test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release_logs | Out-Null
          $exe = Resolve-Path "dist\Label_Inspection_Tool\Label_Inspection_Tool.exe"
          $out = Join-Path $PWD "release_logs\exe_ocr_smoke.json"
          $p = Start-Process -FilePath $exe -ArgumentList "--self-test-ocr","--self-test-output",$out -PassThru -Wait
          if ($p.ExitCode -ne 0) {
            if (Test-Path $out) { Get-Content $out }
            throw "Packaged EXE OCR smoke test failed with exit code $($p.ExitCode)"
          }
          Get-Content $out
      - name: Copy external profiles
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\Label_Inspection_Tool\profiles | Out-Null
          Copy-Item label_tool\profiles\*.json dist\Label_Inspection_Tool\profiles\ -Force
      - name: Build environment record
        shell: pwsh
        run: |
          python --version | Out-File release_logs\build_environment.txt
          pip freeze | Out-File -Append release_logs\build_environment.txt
          "Version: V1.7.2" | Out-File -Append release_logs\build_environment.txt
          "Build UTC: $(Get-Date -AsUTC -Format o)" | Out-File -Append release_logs\build_environment.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Label_Inspection_Tool_V1.7.2_Live_Camera_Smart_Lock_Windows
          path: |
            dist/Label_Inspection_Tool/**
            release_logs/**
